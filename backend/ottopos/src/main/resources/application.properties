spring.application.name=ottopos

# Conexión a MySQL
# La URL JDBC se construye en Java en la clase DatabaseConfig a partir de las
# variables cortas DB_HOST, DB_PORT, DB_NAME, DB_USER y DB_PASS (cada valor se
# limpia de espacios/saltos de línea invisibles al pegarlo). Opcional:
# SPRING_DATASOURCE_URL tiene prioridad si se define (método anterior).
# Esta clase no se carga con el perfil "test" (las pruebas usan H2).

# Configuración de JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Orígenes permitidos para CORS (separados por coma).
# En producción agrega tu dominio propio, ej:
# CORS_ALLOWED_ORIGINS=https://tudominio.com,https://2026gelver.github.io
ottopos.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://2026gelver.github.io,http://localhost:8080,http://localhost:5500,http://127.0.0.1:5500}

# Puerto del servidor
server.port=${PORT:8081}