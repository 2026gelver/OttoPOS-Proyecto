spring.application.name=ottopos

# Conexión a MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ottopos}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

# Configuración de JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Orígenes permitidos para CORS (separados por coma).
# En producción agrega tu dominio propio, ej:
# CORS_ALLOWED_ORIGINS=https://tudominio.com,https://2026gelver.github.io
ottopos.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://2026gelver.github.io,http://localhost:8080,http://localhost:5500,http://127.0.0.1:5500}

# Puerto del servidor
server.port=${PORT:8081}