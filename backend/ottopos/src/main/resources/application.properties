spring.application.name=ottopos

# Conexión a MySQL
# La URL se construye con variables cortas (DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASS)
# para evitar errores al pegar la URL completa. Si se define SPRING_DATASOURCE_URL,
# esta tiene prioridad (compatibilidad con el método anterior).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ottopos}?ssl-mode=REQUIRED}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASS:}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

# Configuración de JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Orígenes permitidos para CORS (separados por coma).
# En producción agrega tu dominio propio, ej:
# CORS_ALLOWED_ORIGINS=https://tudominio.com,https://2026gelver.github.io
ottopos.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://2026gelver.github.io,http://localhost:8080,http://localhost:5500,http://127.0.0.1:5500}

# Puerto del servidor
server.port=${PORT:8081}