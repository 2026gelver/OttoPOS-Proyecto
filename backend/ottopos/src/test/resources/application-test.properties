# ================================================
# Configuración de pruebas automatizadas — OttoPOS
# Base de datos H2 en memoria (modo MySQL)
# Definida en el Plan de Pruebas GA9-220501096
# ================================================
spring.application.name=ottopos-test

# Base de datos en memoria H2 (modo compatibilidad MySQL)
spring.datasource.url=jdbc:h2:mem:ottopos;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA con creación de esquema desde las entidades
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# No usa servidor Web externo en las pruebas (MockMvc)
spring.main.web-application-type=servlet

# Silencia el warning de plantillas Thymeleaf en pruebas
spring.thymeleaf.check-template-location=false