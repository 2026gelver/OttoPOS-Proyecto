# ============================================================
# GitHub Actions - Publicar el frontend en GitHub Pages
# Se ejecuta en cada push a la rama master.
# Requisito previo: en GitHub -> Settings -> Pages ->
# Source: "GitHub Actions".
# ============================================================
name: Deploy Frontend a GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir carpeta frontend como sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4